# Aljabr Runner — headless CI/CD runner for Wayang agents
quarkus.banner.enabled=false
quarkus.log.level=WARN

# Disable HTTP server — this is a pure CLI application
quarkus.http.port=-1
# Point Picocli at the new AljabrRunner command class
quarkus.picocli.top-command=tech.kayys.wayang.runner.AljabrRunner

# Disable datasource unless explicitly configured by the user
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:aljabr;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
